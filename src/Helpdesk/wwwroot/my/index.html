<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tickets</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="wrapper">
    <header class="main-header">
      <a class="logo" href="/my">FlexDesk</a>
      <nav class="navbar">
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Toggle sidebar">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor" aria-hidden="true"><path d="M0 0h18v2H0zm0 6h18v2H0zm0 6h18v2H0z"/></svg>
        </button>
        <ul class="navbar-menu">
          <li>
            <span class="user-chip">
              <span class="avatar" id="header-avatar">G</span>
              <span id="header-username">Guest</span>
            </span>
          </li>
        </ul>
      </nav>
    </header>

    <aside class="main-sidebar">
      <section class="sidebar">
        <div class="user-panel">
          <span class="avatar avatar-lg" id="sidebar-avatar">G</span>
          <div>
            <p class="name">Hello, <span id="sidebar-username">Guest</span></p>
            <span class="online">Online</span>
          </div>
        </div>
        <div class="sidebar-form">
          <input id="ticket-search" type="search" placeholder="Search..." />
        </div>
        <ul class="sidebar-menu">
          <li class="active">
            <a href="/my">
              <svg class="menu-ico" viewBox="0 0 16 16"><path d="M0 1h16v3H0zm0 5h16v3H0zm0 5h16v4H0z"/></svg>
              <span class="menu-label">My Tickets</span>
            </a>
          </li>
          <li>
            <a href="/agent">
              <svg class="menu-ico" viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m1 8V4H7v4H3v2h4v4h2v-4h4V8z"/></svg>
              <span class="menu-label">Create Ticket</span>
            </a>
          </li>
          <li>
            <a href="#" id="logout">
              <svg class="menu-ico" viewBox="0 0 16 16"><path d="M6 2h8v12H6v-2h6V4H6zM7 7H0v2h7v3l5-4-5-4z"/></svg>
              <span class="menu-label">Sign out</span>
            </a>
          </li>
        </ul>
      </section>
    </aside>

    <div class="content-wrapper">
      <section class="content-header">
        <h1 id="page-title">My Tickets</h1>
        <ol class="breadcrumb">
          <li>FlexDesk</li>
          <li class="active" id="breadcrumb-current">My Tickets</li>
        </ol>
      </section>

      <section class="content">
        <div class="box box-primary">
          <div class="box-header">
            <h3 class="box-title">My tickets</h3>
          </div>
          <div class="box-body table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Subject</th>
                  <th>Created</th>
                  <th>Status</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="/my/app.js"></script>
</body>
</html>
